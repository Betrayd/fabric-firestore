
plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
	id 'com.gradleup.shadow' version '9.0.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fabric-firestore" {
			sourceSet sourceSets.main
		}
	}
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	shade("com.google.cloud:google-cloud-firestore:${project.firestore_version}") {
		// Keep Minecraft-provided libraries out of the shaded dependency graph.
		// Remove an exclusion if a required class is missing at runtime.
		exclude group: "org.slf4j"
		exclude group: "com.google.code.gson"
		exclude group: "org.apache.httpcomponents"
		exclude group: "commons-codec"
	}
}

tasks.named('shadowJar') {
	configurations = [project.configurations.shade]

	archiveClassifier = 'dev-shadow'

	// Critical: allow service descriptors to reach Shadow's merger.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	// Merge gRPC and other Java ServiceLoader registrations.
	mergeServiceFiles()

	// Discard signatures from dependency JARs; the shaded JAR changes their contents.
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'

	// Minecraft includes Guava, so isolate the dependency's copy.
	relocate 'com.google.common', 'fabricfirestore.shadow.guava'
	relocate 'com.google.thirdparty',
			'fabricfirestore.shadow.guava.thirdparty'
}

tasks.named('remapJar') {
	dependsOn tasks.named('shadowJar')

	inputFile = tasks.named('shadowJar').flatMap {
		it.archiveFile
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Configure a publishing repository here if needed.
	}
}
